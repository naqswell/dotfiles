# tmux — заточено под общую сессию "phone" (ttyd web-терминал + десктоп).
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Окно ресайзится по активному клиенту, а не по самому маленькому из всех —
# иначе подключённый iPhone ужимает терминал на десктопе.
setw -g aggressive-resize on
